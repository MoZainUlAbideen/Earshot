# Runs the full test suite on every push and pull request.
# Postgres is the same pinned pgvector image as docker-compose.yml. The password below is a
# throwaway that only exists inside GitHub's disposable CI machine (not the real .env one).
# Live tests (real Groq calls) stay skipped by default, so CI needs no API keys or quota.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: earshot
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: earshot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earshot -d earshot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://earshot:ci-throwaway-password@127.0.0.1:5432/earshot
    steps:
      # Exact versions: setup-uv publishes no floating major tag (v10 doesn't exist, v10.2.0 does).
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Tests
        run: uv run pytest

  web:
    # The Next.js site: lint, unit tests, and a production build (which also type-checks).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - run: npx eslint .
      - run: npm test
      - run: npm run build
