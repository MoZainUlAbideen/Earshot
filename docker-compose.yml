# Local Postgres for development. Start: docker compose up -d   Stop: docker compose down
# Credentials come from .env (see .env.example).
services:
  postgres:
    # Postgres 17 + pgvector, pinned. "trixie" = Debian 13, the same OS (glibc 2.41) the data was
    # created on: a different glibc changes text sort order and can corrupt text indexes.
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, not exposed to the network
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
