[project]
name = "earshot"
version = "0.1.0"
description = "Ask questions across podcasts and get answers with timestamp citations."
readme = "README.md"
authors = [
    { name = "MoZainn", email = "mu.zainulabideen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
earshot = "earshot.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
