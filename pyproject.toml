[project]
name = "earshot"
version = "0.1.0"
description = "Ask questions across podcasts and get answers with timestamp citations."
readme = "README.md"
authors = [
    { name = "MoZainn", email = "mu.zainulabideen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Not imported directly: faster-whisper 1.2.1 calls av.open(metadata_errors=...),
    # which av 19 removed. Drop this pin once faster-whisper supports av 19.
    "av>=11,<19",
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
]

[project.scripts]
earshot = "earshot.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "whisper-normalizer>=0.1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Short tracebacks: the default style prints function arguments, which leaked
# DATABASE_URL (with password) when a connection failed. CI logs can be public.
# Live tests call real APIs (cost quota, need network): skipped unless `pytest -m live`.
addopts = "--tb=short -m 'not live'"
markers = ["live: calls a real external API; run explicitly with `pytest -m live`"]
# whisper-normalizer has an invalid escape in a docstring; harmless, but noisy.
filterwarnings = ["ignore::SyntaxWarning"]
